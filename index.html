<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reny ♡ | Álbum de recuerdos</title>
<style>
  :root { --paper:#fffdfb; --ink:#342b2b; --accent:#b83232; --bg:#f7eee9; }
  * { box-sizing: border-box; }
  body {
    margin:0; color:var(--ink);
    font-family: "Georgia", "Times New Roman", serif;
    background: radial-gradient(circle at top, #fffaf7, var(--bg));
  }
  header { text-align:center; padding:54px 20px 32px; }
  .eyebrow { font: 12px/1.5 Arial,sans-serif; letter-spacing: .28em; text-transform:uppercase; color:#9d7770; }
  h1 { margin:10px 0 8px; font-size:clamp(42px,8vw,76px); font-weight:normal; letter-spacing:.04em; }
  header p { margin:0; color:#876e68; font-style:italic; font-size:17px; }
  .toolbar { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; padding:0 18px 30px; }
  button { border:1px solid #d8bdb6; background:#fffaf7; color:#6d4540; padding:10px 16px; border-radius:24px; cursor:pointer; font:13px Arial,sans-serif; }
  button:hover { background:#f3e4df; }
  .album { width:min(1100px,94%); margin:0 auto 60px; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:34px 26px; }
  .memory { display:flex; flex-direction:column; align-items:center; }
  .date { font:13px Arial,sans-serif; letter-spacing:.12em; color:#9b6b64; text-transform:uppercase; margin-bottom:12px; }
  .polaroid {
    width:100%; max-width:270px; padding:12px 12px 54px; background:var(--paper);
    box-shadow:0 5px 14px #4c30201c, 0 1px 3px #4c30202a;
    transform:rotate(var(--tilt, 0deg)); transition:transform .2s, box-shadow .2s;
    position:relative;
  }
  .polaroid:hover { transform:rotate(0deg) translateY(-4px); box-shadow:0 12px 22px #4c30202a; }
  .photo-area { width:100%; aspect-ratio: 1 / 1; background:#080808; position:relative; overflow:hidden; cursor:pointer; }
  .photo-area img { width:100%; height:100%; object-fit:cover; display:none; }
  .photo-area img.visible { display:block; }
  .placeholder { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#777; font:12px Arial,sans-serif; background:#080808; }
  .photo-area.has-photo .placeholder { display:none; }
  .heart { position:absolute; right:19px; bottom:13px; color:#b52c2c; font-family:Arial,sans-serif; font-size:39px; line-height:1; transform:rotate(-12deg); }
  .upload { display:block; margin-top:10px; font:12px Arial,sans-serif; color:#8d6963; cursor:pointer; }
  .upload input { display:none; }
  .caption { margin-top:8px; width:100%; max-width:270px; text-align:center; }
  .caption input { border:0; border-bottom:1px dashed #d7b9b1; background:transparent; width:100%; text-align:center; padding:6px; font:italic 14px Georgia,serif; color:#76534d; outline:none; }
  footer { text-align:center; padding:10px 20px 45px; color:#a48780; font-size:14px; }
  @media(max-width:520px) { .album { grid-template-columns:repeat(2,minmax(0,1fr)); gap:24px 14px; } .polaroid { padding:8px 8px 42px; } .heart {right:13px;bottom:10px;font-size:30px;} .date{font-size:11px;letter-spacing:.06em;} }
</style>
</head>
<body>
<header>
  <div class="eyebrow">Nuestro álbum de recuerdos</div>
  <h1>Reny <span style="color:#b83232">♡</span></h1>
  <p>Un sábado a la vez · 27 de junio — 12 de diciembre de 2026</p>
</header>
<div class="toolbar">
  <button onclick="document.querySelectorAll('.upload input').forEach(i=>i.click())">Agregar fotos</button>
  <button onclick="clearPhotos()">Quitar todas las fotos</button>
</div>
<main class="album" id="album"></main>
<footer>Hecho con cariño, para guardar momentos bonitos. ♡</footer>
<script>
const dates = [
"27 de junio de 2026","4 de julio de 2026","11 de julio de 2026","18 de julio de 2026","25 de julio de 2026",
"1 de agosto de 2026","8 de agosto de 2026","15 de agosto de 2026","22 de agosto de 2026","29 de agosto de 2026",
"5 de septiembre de 2026","12 de septiembre de 2026","19 de septiembre de 2026","26 de septiembre de 2026",
"3 de octubre de 2026","10 de octubre de 2026","17 de octubre de 2026","24 de octubre de 2026","31 de octubre de 2026",
"7 de noviembre de 2026","14 de noviembre de 2026","21 de noviembre de 2026","28 de noviembre de 2026",
"5 de diciembre de 2026","12 de diciembre de 2026"
];
const album = document.getElementById('album');
dates.forEach((date, i) => {
  const card = document.createElement('section'); card.className='memory';
  const tilt = (i%2===0 ? -1 : 1) * (0.4 + (i%3)*0.35);
  card.innerHTML = `
    <div class="date">Sábado · ${date}</div>
    <div class="polaroid" style="--tilt:${tilt}deg">
      <div class="photo-area" id="area-${i}" onclick="document.getElementById('file-${i}').click()">
        <div class="placeholder">Haz clic para colocar una foto</div>
        <img id="img-${i}" alt="Recuerdo del ${date}">
      </div>
      <div class="heart">♡</div>
    </div>
    <label class="upload">＋ Elegir foto
      <input id="file-${i}" type="file" accept="image/*" onchange="loadPhoto(event,${i})">
    </label>
    <div class="caption"><input placeholder="Escribe un pequeño recuerdo…" aria-label="Descripción del recuerdo"></div>
  `;
  album.appendChild(card);
});
// Guarda fotos y captions en IndexedDB para que permanezcan al recargar.
const DB_NAME='RenyAlbumDB', STORE_NAME='recuerdos';
let db;
const dbReady=new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>req.result.createObjectStore(STORE_NAME);
  req.onsuccess=()=>{db=req.result;resolve(db);};
  req.onerror=()=>reject(req.error);
});
function storeValue(key,value){
  return dbReady.then(database=>new Promise((resolve,reject)=>{
    const tx=database.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).put(value,key);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  }));
}
function readValue(key){
  return dbReady.then(database=>new Promise((resolve,reject)=>{
    const req=database.transaction(STORE_NAME,'readonly').objectStore(STORE_NAME).get(key);
    req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
  }));
}
function removeValue(key){
  return dbReady.then(database=>new Promise((resolve,reject)=>{
    const tx=database.transaction(STORE_NAME,'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
  }));
}
function displayPhoto(i,blob){
  if(!blob)return;
  const img=document.getElementById('img-'+i);
  if(img.dataset.objectUrl)URL.revokeObjectURL(img.dataset.objectUrl);
  const url=URL.createObjectURL(blob);img.dataset.objectUrl=url;
  img.src=url;img.classList.add('visible');
  document.getElementById('area-'+i).classList.add('has-photo');
}
async function loadPhoto(event,i){
  const file=event.target.files[0];if(!file)return;
  try{await storeValue('photo-'+i,file);displayPhoto(i,file);}
  catch(e){alert('No se pudo guardar la foto. Prueba con una imagen más pequeña.');}
}
async function clearPhotos(){
  if(!confirm('¿Quieres quitar todas las fotos del álbum?'))return;
  for(let i=0;i<dates.length;i++){
    await removeValue('photo-'+i);
    const img=document.getElementById('img-'+i);
    if(img.dataset.objectUrl)URL.revokeObjectURL(img.dataset.objectUrl);
    img.src='';img.classList.remove('visible');delete img.dataset.objectUrl;
    document.getElementById('area-'+i).classList.remove('has-photo');
    document.getElementById('file-'+i).value='';
  }
}
async function restoreAlbum(){
  for(let i=0;i<dates.length;i++){
    const photo=await readValue('photo-'+i);if(photo)displayPhoto(i,photo);
    const caption=await readValue('caption-'+i);
    if(caption!==undefined)document.querySelectorAll('.caption input')[i].value=caption;
  }
}
document.addEventListener('DOMContentLoaded',async()=>{
  document.querySelectorAll('.caption input').forEach((input,i)=>{
    input.addEventListener('input',()=>storeValue('caption-'+i,input.value));
  });
  try{await restoreAlbum();}catch(e){console.warn('No se pudieron restaurar los recuerdos',e);}
});
</script>
</body>
</html>
