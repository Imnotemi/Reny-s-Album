<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Álbum de recuerdos de Reny ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#a93438;--ink:#4b3434}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7f5,#fbe9e8);color:var(--ink);font-family:Quicksand,sans-serif}
header{text-align:center;padding:34px 16px 18px}h1{font:700 clamp(34px,7vw,58px) 'Playfair Display',serif;color:#9c3039;margin:0}header p{color:#9b7777;margin:8px}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 12px 20px}button{border:0;border-radius:22px;background:var(--red);color:white;padding:10px 15px;font:600 14px Quicksand;cursor:pointer}button.secondary{background:white;color:var(--red);border:1px solid #e7b7b8}button:disabled{opacity:.6}
#loginBox{display:none;max-width:360px;margin:0 auto 20px;padding:18px;background:white;border-radius:14px;box-shadow:0 8px 25px #6b33331a}#loginBox input{width:100%;padding:11px;margin:6px 0;border:1px solid #e3caca;border-radius:8px;font:inherit}#loginMessage{font-size:13px;margin-top:8px}
#status{text-align:center;font-size:13px;margin:8px;color:#7e5656;min-height:20px;overflow-wrap:anywhere}
main{max-width:1100px;margin:auto;padding:10px 18px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:26px}
.entry{display:flex;flex-direction:column;align-items:center}.date{font:700 19px 'Playfair Display',serif;margin-bottom:10px;color:#96343a;text-align:center;text-transform:capitalize}
.polaroid{width:100%;max-width:300px;background:#fff;padding:12px 12px 48px;box-shadow:0 7px 18px #4d1c1c22;transform:rotate(var(--tilt));position:relative}
.photo{width:100%;aspect-ratio:1/1;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.empty{color:#aaa;font-size:12px;text-align:center;padding:10px}
.heart{position:absolute;right:17px;bottom:12px;color:#b32f34;font:32px 'Playfair Display',serif;transform:rotate(-12deg)}
.description{width:100%;max-width:300px;text-align:center;margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5;color:#765454}
.description:empty{display:none}.admin-controls{display:none;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}.admin-controls button{font-size:12px;padding:8px 11px}
.editor{display:none;width:100%;max-width:300px;margin-top:8px}.editor textarea{width:100%;min-height:70px;border:1px solid #e3caca;border-radius:9px;padding:9px;font:13px Quicksand;resize:vertical}.editor button{margin:5px 4px 0 0}
footer{text-align:center;padding:30px;color:#a17c7c}@media(max-width:600px){main{gap:24px}.polaroid{max-width:320px}}
</style>
</head>
<body>
<header><h1>Álbum de recuerdos de Reny ❤️</h1><p>Un recuerdo por cada sábado ❤️</p></header>
<div class="toolbar"><button id="adminBtn">Acceso administrador</button><button class="secondary" id="logoutBtn" style="display:none">Cerrar sesión</button></div>
<div id="loginBox"><input id="email" type="email" placeholder="Correo administrador" autocomplete="username"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="loginBtn">Iniciar sesión</button> <button class="secondary" id="cancelLogin">Cancelar</button><div id="loginMessage"></div></div>
<div id="status">Preparando álbum…</div><main id="album"></main><footer>Hecho con cariño para Reny ❤️</footer>
<script>
'use strict';
const SUPABASE_URL="https://upsbesrdnxzccdilngvw.supabase.co";
const SUPABASE_KEY="sb_publishable_8fBljStSrnIplI2IANq98g_ra_4LXbk";
const BUCKET="reny-photos", ADMIN_EMAIL="emilianoluna3017@gmail.com";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let session=null, memories=[];
const dates=[];for(let d=new Date(2026,5,27);d<=new Date(2026,11,12);d.setDate(d.getDate()+7))dates.push(new Date(d));
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pretty=s=>new Intl.DateTimeFormat("es-MX",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}).format(new Date(s+"T12:00:00Z"));
const album=document.getElementById("album");
function render(){
 album.innerHTML="";
 dates.forEach((d,i)=>{
  const id=fmt(d),m=memories.find(x=>x.memory_date===id)||{memory_date:id,description:"",image_path:null};
  const article=document.createElement("section");article.className="entry";
  const pol=document.createElement("div");pol.className="polaroid";pol.style.setProperty("--tilt",i%2===0?"-1.2deg":"1.1deg");
  const photo=document.createElement("div");photo.className="photo";
  if(m.image_path){const {data}=sb.storage.from(BUCKET).getPublicUrl(m.image_path);const img=document.createElement("img");img.src=data.publicUrl;img.alt="Recuerdo del "+pretty(id);img.loading="lazy";photo.appendChild(img)}
  else{const empty=document.createElement("div");empty.className="empty";empty.textContent="Tu recuerdo de este sábado ❤️";photo.appendChild(empty)}
  const heart=document.createElement("div");heart.className="heart";heart.textContent="♡";pol.append(photo,heart);
  const desc=document.createElement("div");desc.className="description";desc.textContent=m.description||"";
  article.append(document.createElement("div"));article.lastChild.className="date";article.lastChild.textContent=pretty(id);article.append(pol,desc);
  if(session){
   const controls=document.createElement("div");controls.className="admin-controls";controls.style.display="flex";
   const file=document.createElement("input");file.type="file";file.accept="image/*";file.hidden=true;
   const upload=document.createElement("button");upload.textContent=m.image_path?"Cambiar foto":"Agregar foto";upload.onclick=()=>file.click();
   const del=document.createElement("button");del.className="secondary";del.textContent="Eliminar foto";del.disabled=!m.image_path;
   del.onclick=()=>deletePhoto(id,m);
   file.onchange=()=>{if(file.files[0])uploadPhoto(id,file.files[0],m);file.value=""};
   const edit=document.createElement("button");edit.className="secondary";edit.textContent="Editar descripción";
   const editor=document.createElement("div");editor.className="editor";editor.style.display="block";
   const area=document.createElement("textarea");area.value=m.description||"";area.placeholder="Escribe qué pasó este sábado…";area.style.display="none";
   const save=document.createElement("button");save.textContent="Guardar";save.style.display="none";
   const cancel=document.createElement("button");cancel.className="secondary";cancel.textContent="Cancelar";cancel.style.display="none";
   edit.onclick=()=>{area.style.display="block";save.style.display="inline-block";cancel.style.display="inline-block";edit.style.display="none"};
   cancel.onclick=()=>{area.value=m.description||"";area.style.display="none";save.style.display="none";cancel.style.display="none";edit.style.display="inline-block"};
   save.onclick=()=>saveDescription(id,area.value,save);
   editor.append(area,save,cancel);controls.append(upload,del,edit,file);article.append(controls,editor);
  }
  album.append(article);
 });
}
async function loadAlbum(){
 const status=document.getElementById("status");status.textContent="Cargando recuerdos…";
 const {data,error}=await sb.from("memories").select("memory_date,description,image_path").order("memory_date");
 if(error){status.textContent="No se pudo cargar el álbum: "+error.message;return}
 memories=data||[];render();status.textContent=session?"Administrador conectado ❤️":"Álbum público · Solo lectura ❤️";
 document.getElementById("logoutBtn").style.display=session?"inline-block":"none";
}
async function uploadPhoto(id,file,m){
 if(!session||session.user.email!==ADMIN_EMAIL){alert("Esta cuenta no tiene permiso de administrador.");return}
 if(!file.type.startsWith("image/")){alert("Selecciona una imagen.");return}
 const status=document.getElementById("status");status.textContent="Subiendo foto…";
 const ext=(file.name.split(".").pop()||"jpg").replace(/[^a-z0-9]/gi,"")||"jpg";
 const path=id+"/recuerdo."+ext;
 if(m.image_path){const {error:rm}=await sb.storage.from(BUCKET).remove([m.image_path]);if(rm){status.textContent="No se pudo reemplazar: "+rm.message;return}}
 const {error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:file.type,cacheControl:"0"});
 if(error){status.textContent="Error al subir: "+error.message;return}
 const {error:dbErr}=await sb.from("memories").update({image_path:path}).eq("memory_date",id);
 if(dbErr){status.textContent="Foto subida, pero no se guardó la referencia: "+dbErr.message;return}
 await loadAlbum();
}
async function deletePhoto(id,m){
 if(!session||!m.image_path)return;
 if(!confirm("¿Eliminar la foto del "+pretty(id)+"?"))return;
 const {error}=await sb.storage.from(BUCKET).remove([m.image_path]);if(error){alert(error.message);return}
 const {error:dbErr}=await sb.from("memories").update({image_path:null}).eq("memory_date",id);
 if(dbErr){alert(dbErr.message);return}await loadAlbum();
}
async function saveDescription(id,value,button){
 if(!session||session.user.email!==ADMIN_EMAIL){alert("Esta cuenta no tiene permiso.");return}
 button.disabled=true;
 const {error}=await sb.from("memories").update({description:value.trim()}).eq("memory_date",id);
 button.disabled=false;if(error){alert("No se pudo guardar: "+error.message);return}await loadAlbum();
}
document.getElementById("adminBtn").onclick=()=>{document.getElementById("loginBox").style.display="block";document.getElementById("loginMessage").textContent=""};
document.getElementById("cancelLogin").onclick=()=>document.getElementById("loginBox").style.display="none";
document.getElementById("loginBtn").onclick=async()=>{
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value,msg=document.getElementById("loginMessage"),btn=document.getElementById("loginBtn");
 if(!email||!password){msg.textContent="Escribe tu correo y contraseña.";return}
 btn.disabled=true;msg.textContent="Iniciando sesión…";
 const {data,error}=await sb.auth.signInWithPassword({email,password});btn.disabled=false;
 if(error){msg.textContent="No se pudo iniciar sesión: "+error.message;return}
 if(data.user.email!==ADMIN_EMAIL){await sb.auth.signOut();msg.textContent="Esta cuenta no es la administradora.";return}
 session=data.session;document.getElementById("password").value="";document.getElementById("loginBox").style.display="none";await loadAlbum();
};
document.getElementById("logoutBtn").onclick=async()=>{await sb.auth.signOut();session=null;await loadAlbum()};
sb.auth.onAuthStateChange((_event,s)=>{session=s;});
sb.auth.getSession().then(async({data})=>{session=data.session;if(session&&session.user.email!==ADMIN_EMAIL){await sb.auth.signOut();session=null}await loadAlbum()});
</script>
</body></html>
