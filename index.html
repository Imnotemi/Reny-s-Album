<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reny ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{--pink:#e7a2a6;--red:#a93438;--cream:#fffaf7;--ink:#4b3434}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#fff7f5,#fbe9e8);color:var(--ink);font-family:Quicksand,sans-serif}
header{text-align:center;padding:36px 16px 20px}
h1{font:700 clamp(42px,8vw,72px) 'Playfair Display',serif;margin:0;color:#9c3039;letter-spacing:2px}
header p{margin:8px 0 0;color:#9b7777}
.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 12px 24px}
button{border:0;border-radius:22px;background:#a93438;color:white;padding:10px 16px;font:600 14px Quicksand;cursor:pointer}
button.secondary{background:#fff;color:#96343a;border:1px solid #e7b7b8}
button:disabled{opacity:.6;cursor:wait}
#loginBox{display:none;max-width:360px;margin:0 auto 20px;padding:18px;background:white;border-radius:14px;box-shadow:0 8px 25px #6b33331a}
#loginBox input{width:100%;padding:11px;margin:6px 0;border:1px solid #e3caca;border-radius:8px;font:inherit}
#loginMessage{font-size:13px;margin-top:8px;overflow-wrap:anywhere}
#status{text-align:center;font-size:13px;margin:8px;color:#7e5656;min-height:20px;overflow-wrap:anywhere}
main{max-width:1100px;margin:auto;padding:10px 18px 60px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:26px}
.entry{display:flex;flex-direction:column;align-items:center}
.date{font:700 20px 'Playfair Display',serif;margin-bottom:10px;color:#96343a;text-align:center}
.polaroid{width:100%;max-width:300px;background:#fff;padding:12px 12px 48px;box-shadow:0 7px 18px #4d1c1c22;transform:rotate(var(--tilt));position:relative}
.photo{width:100%;aspect-ratio:1/1;background:#111;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .empty{color:#aaa;font-size:12px;text-align:center;padding:10px}
.heart{position:absolute;right:17px;bottom:12px;color:#b32f34;font:32px 'Playfair Display',serif;transform:rotate(-12deg)}
.controls{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:12px}
.controls button{font-size:12px;padding:8px 11px}
footer{text-align:center;padding:30px;color:#a17c7c}
@media(max-width:600px){main{gap:24px}.polaroid{max-width:320px}}
</style>
</head>

<body>

<header>
<h1>Reny</h1>
<p>Un recuerdo por cada sábado ❤️</p>
</header>

<div class="toolbar">
<button id="adminBtn">Acceso administrador</button>
<button class="secondary" id="logoutBtn" style="display:none">Cerrar sesión</button>
</div>

<div id="loginBox">
<input id="email" type="email" placeholder="Correo administrador" autocomplete="username">
<input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
<button id="loginBtn">Iniciar sesión</button>
<button class="secondary" id="cancelLogin">Cancelar</button>
<div id="loginMessage"></div>
</div>

<div id="status">Preparando álbum…</div>
<main id="album"></main>
<footer>Hecho con cariño para Reny ❤️</footer>

<script>
'use strict';

const SUPABASE_URL = "https://yfhfilrmiprpwcyravug.supabase.co";
const SUPABASE_KEY = "sb_publishable_s6rq9jk1kAiGUQ-VdeT8Qw_npZbqenR";
const BUCKET = "reny-fotos";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let session = null;
const dates = [];

for(let d=new Date(2026,5,27);d<=new Date(2026,11,12);d.setDate(d.getDate()+7)){
 dates.push(new Date(d.getFullYear(),d.getMonth(),d.getDate()));
}

const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const label=d=>new Intl.DateTimeFormat('es-MX',{
 weekday:'long',day:'numeric',month:'long',year:'numeric'
}).format(d);

const tilt=i=>i%2===0?'-1.2deg':'1.1deg';

function makeEntry(d,i){
 const id=fmt(d);
 const article=document.createElement('section');
 article.className='entry';

 article.innerHTML=`
 <div class="date">${label(d)}</div>
 <div class="polaroid" style="--tilt:${tilt(i)}">
  <div class="photo" id="photo-${id}">
   <div class="empty">Tu recuerdo de este sábado<br>❤️</div>
  </div>
  <div class="heart">♡</div>
 </div>
 <div class="controls admin-controls" style="display:none">
  <button data-upload="${id}">Agregar / cambiar foto</button>
  <button data-delete="${id}" class="secondary">Eliminar foto</button>
  <input type="file" accept="image/*" id="file-${id}" hidden>
 </div>`;

 return article;
}

const album=document.getElementById('album');
dates.forEach((d,i)=>album.appendChild(makeEntry(d,i)));

async function loadAlbum(){
 const status=document.getElementById('status');
 status.textContent='Cargando recuerdos…';

 try{
  const results=await Promise.allSettled(dates.map(async d=>{
   const id=fmt(d);
   const photo=document.getElementById('photo-'+id);

   photo.innerHTML='<div class="empty">Cargando recuerdo…</div>';

   const {data,error}=await supabase.storage.from(BUCKET).list(id,{limit:100});

   if(error)throw new Error(id+': '+error.message);

   photo.innerHTML='';

   const files=(data||[])
    .filter(file=>file.name&&!file.name.startsWith('.'))
    .sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));

   if(!files.length){
    photo.innerHTML='<div class="empty">Tu recuerdo de este sábado<br>❤️</div>';
    return;
   }

   const file=files[0];
   const path=`${id}/${file.name}`;

   const {data:urlData}=supabase.storage.from(BUCKET).getPublicUrl(path);

   const img=document.createElement('img');
   img.src=urlData.publicUrl;
   img.alt='Recuerdo '+label(d);
   img.loading='lazy';

   img.onerror=()=>{
    photo.innerHTML='<div class="empty">No se pudo mostrar la imagen</div>';
   };

   photo.appendChild(img);
  }));

  const errors=results.filter(r=>r.status==='rejected');

  if(errors.length){
   console.error(errors);
   status.textContent=`Álbum cargado con ${errors.length} error(es). Revisa las políticas de Storage.`;
  }else{
   status.textContent=session?'Administrador conectado ❤️':'Álbum público · Solo lectura ❤️';
  }

 }catch(error){
  console.error(error);
  status.textContent='Error al conectar con Supabase: '+error.message;
 }

 document.querySelectorAll('.admin-controls').forEach(el=>{
  el.style.display=session?'flex':'none';
 });

 document.getElementById('logoutBtn').style.display=session?'inline-block':'none';
}

document.getElementById('adminBtn').onclick=()=>{
 document.getElementById('loginBox').style.display='block';
 document.getElementById('loginMessage').textContent='';
};

document.getElementById('cancelLogin').onclick=()=>{
 document.getElementById('loginBox').style.display='none';
};

document.getElementById('loginBtn').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value;
 const msg=document.getElementById('loginMessage');
 const button=document.getElementById('loginBtn');

 if(!email||!password){
  msg.textContent='Escribe tu correo y contraseña.';
  return;
 }

 button.disabled=true;
 msg.textContent='Iniciando sesión…';

 try{
  const {data,error}=await supabase.auth.signInWithPassword({email,password});

  if(error){
   msg.textContent='No se pudo iniciar sesión: '+error.message;
   return;
  }

  session=data.session;
  document.getElementById('loginBox').style.display='none';
  document.getElementById('password').value='';
  await loadAlbum();

 }catch(error){
  msg.textContent='Error: '+error.message;
 }finally{
  button.disabled=false;
 }
};

document.getElementById('logoutBtn').onclick=async()=>{
 const {error}=await supabase.auth.signOut();
 if(error)alert(error.message);
 session=null;
 await loadAlbum();
};

album.addEventListener('click',async e=>{
 const upload=e.target.closest('[data-upload]');
 const del=e.target.closest('[data-delete]');

 if(upload){
  if(!session){
   alert('Inicia sesión como administrador primero.');
   return;
  }
  document.getElementById('file-'+upload.dataset.upload).click();
 }

 if(del){
  if(!session){
   alert('Inicia sesión como administrador.');
   return;
  }

  const id=del.dataset.delete;
  if(!confirm('¿Seguro que quieres eliminar la foto de '+id+'?'))return;

  const {data,error}=await supabase.storage.from(BUCKET).list(id,{limit:100});

  if(error){
   alert(error.message);
   return;
  }

  const paths=(data||[])
   .filter(file=>file.name&&!file.name.startsWith('.'))
   .map(file=>`${id}/${file.name}`);

  if(paths.length){
   const {error:removeError}=await supabase.storage.from(BUCKET).remove(paths);
   if(removeError){
    alert(removeError.message);
    return;
   }
  }

  await loadAlbum();
 }
});

dates.forEach(d=>{
 const id=fmt(d);
 const input=document.getElementById('file-'+id);

 input.addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];
  if(!file)return;

  if(!session){
   alert('Inicia sesión primero.');
   e.target.value='';
   return;
  }

  if(!file.type.startsWith('image/')){
   alert('Selecciona un archivo de imagen.');
   e.target.value='';
   return;
  }

  const status=document.getElementById('status');
  const ext=(file.name.split('.').pop()||'jpg').replace(/[^a-z0-9]/gi,'');
  const path=`${id}/foto-${Date.now()}.${ext}`;

  status.textContent='Subiendo foto para '+id+'…';

  try{
   const {error}=await supabase.storage.from(BUCKET).upload(path,file,{
    cacheControl:'0',
    upsert:false,
    contentType:file.type
   });

   if(error){
    alert('Error al subir: '+error.message);
    status.textContent='No se pudo subir la foto.';
   }else{
    status.textContent='Foto subida correctamente ❤️';
    await loadAlbum();
   }

  }catch(error){
   alert('Error inesperado: '+error.message);
   status.textContent='Error al subir la foto.';
  }finally{
   e.target.value='';
  }
 });
});

supabase.auth.getSession().then(({data,error})=>{
 if(error)console.error(error);
 session=data?.session||null;
 loadAlbum();
}).catch(error=>{
 console.error(error);
 document.getElementById('status').textContent='Error recuperando sesión: '+error.message;
});

supabase.auth.onAuthStateChange((_event,newSession)=>{
 session=newSession;

 document.querySelectorAll('.admin-controls').forEach(el=>{
  el.style.display=session?'flex':'none';
 });

 document.getElementById('logoutBtn').style.display=session?'inline-block':'none';
});
</script>

</body>
</html>
